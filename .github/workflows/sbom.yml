name: SBOM & Dependency Security

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Run weekly on Monday at 08:00 UTC to catch newly disclosed vulnerabilities
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write    # to upload SBOM artifact
      security-events: write  # to submit to Dependency Graph / GHAS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── CycloneDX SBOM ──────────────────────────────────────────────────
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom.cyclonedx.json \
            --package-lock-only
        continue-on-error: true

      - name: Generate CycloneDX SBOM (XML)
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm \
            --output-format XML \
            --output-file sbom.cyclonedx.xml \
            --package-lock-only
        continue-on-error: true

      # ── SPDX SBOM ───────────────────────────────────────────────────────
      - name: Generate SPDX SBOM
        run: |
          pnpm dlx spdx-sbom-generator \
            -p . \
            -o spdx-sbom.json \
            -f json || true
        continue-on-error: true

      # ── npm audit ───────────────────────────────────────────────────────
      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true  # Report but don't block on audit

      - name: Run npm audit (JSON report)
        run: pnpm audit --json > audit-report.json || true

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.xml
            spdx-sbom.json
            audit-report.json
          retention-days: 90

      # ── Publish to GitHub Dependency Graph ────────────────────────────
      - name: Submit SBOM to GitHub Dependency Graph
        uses: anchore/sbom-action/publish-sbom@v0
        if: ${{ hashFiles('sbom.cyclonedx.json') != '' }}
        continue-on-error: true

  audit:
    name: Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (strict)
        run: pnpm audit --prod --audit-level=high

      - name: Check for known malicious packages
        run: |
          # Use pnpm's built-in integrity check
          pnpm install --frozen-lockfile --verify-store-integrity
