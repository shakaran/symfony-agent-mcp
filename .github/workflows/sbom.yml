name: SBOM & Dependency Security

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Run weekly on Monday at 08:00 UTC to catch newly disclosed vulnerabilities
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Default to read-only; jobs elevate only what they actually use.
permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      # The dependency-graph submission API is the only write here. Uploading
      # an artifact needs no extra scope, and nothing in this job writes a
      # SARIF report, so security-events is gone.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── CycloneDX SBOM ──────────────────────────────────────────────────
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-format JSON \
            --output-file sbom.cyclonedx.json \
            --package-lock-only
        continue-on-error: true

      - name: Generate CycloneDX SBOM (XML)
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm@6.0.1 \
            --output-format XML \
            --output-file sbom.cyclonedx.xml \
            --package-lock-only
        continue-on-error: true

      # ── SPDX SBOM ───────────────────────────────────────────────────────
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: spdx-sbom.json
          upload-artifact: false

      # ── npm audit ───────────────────────────────────────────────────────
      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true  # Report but don't block on audit

      - name: Run npm audit (JSON report)
        run: pnpm audit --json > audit-report.json || true

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.xml
            spdx-sbom.json
            audit-report.json
          retention-days: 90

      # ── Publish to GitHub Dependency Graph ────────────────────────────
      - name: Submit SBOM to GitHub Dependency Graph
        uses: anchore/sbom-action/publish-sbom@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: ${{ hashFiles('sbom.cyclonedx.json') != '' }}
        continue-on-error: true

  audit:
    name: Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (strict)
        run: pnpm audit --prod --audit-level=high

      - name: Check for known malicious packages
        run: |
          # Use pnpm's built-in integrity check
          pnpm install --frozen-lockfile --verify-store-integrity
