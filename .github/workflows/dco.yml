name: DCO

# Every commit in a pull request must carry a Signed-off-by line matching its
# author. That line is the contributor asserting they have the right to submit
# the work, under the terms in the DCO file at the repository root.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Signed-off-by present on every commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the full range of the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both ends of the range to enumerate the commits it adds.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue

            author="$(git show -s --format='%an <%ae>' "$sha")"
            # Match the sign-off to the author: a sign-off naming someone else
            # is not that person asserting anything.
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "  ok    $(git show -s --format='%h %s' "$sha")"
            else
              echo "::error::Missing or mismatched Signed-off-by on $(git show -s --format='%h %s' "$sha")"
              echo "        expected: Signed-off-by: $author"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$BASE..$HEAD")

          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) without a valid sign-off. Run: git rebase --signoff $BASE"
            exit 1
          fi

          echo "All commits signed off."
