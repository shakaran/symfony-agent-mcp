name: Fuzz Security Pipeline

# Runs property-based fuzz tests against the security pipeline.
# Tests confirm that all security functions handle arbitrary/adversarial
# inputs without crashing, leaking secrets, or violating invariants.
#
# On a schedule (weekly) and whenever security-critical modules change.

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  push:
    branches: [main]
    paths:
      - 'src/utils/dlp-detector.ts'
      - 'src/utils/output-sanitizer.ts'
      - 'src/utils/input-validator.ts'
      - 'src/utils/prompt-injection-detector.ts'
      - 'src/utils/app-guard.ts'
      - 'src/fuzz/**'
      - 'src/tests/fuzz-*.test.ts'
      - 'src/tests/property-*.test.ts'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Property-based fuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fuzz tests (extended iterations)
        run: >
          node node_modules/jest/bin/jest.js
          --maxWorkers=1
          --forceExit
          --testPathPatterns "fuzz-security|property-security"
          --testTimeout=120000
          --verbose
        env:
          FUZZ_ITERATIONS: '5000'
          # 256 MB was viable under jest 29 but sits below jest 30's own
          # baseline footprint — the corpus suite OOMs before running a
          # single property. 768 MB is the measured floor; 1 GB leaves headroom.
          NODE_OPTIONS: '--max-old-space-size=1024'

      - name: Upload fuzz failure artefacts (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ github.sha }}
          path: |
            fuzz-corpus/
            jest-results.json
          if-no-files-found: ignore
          retention-days: 14
