name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan — Monday 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Read-only by default. Only the two jobs that upload a SARIF report get
# security-events: write, rather than handing it to all seven.
permissions:
  contents: read

jobs:
  # ── 1. CodeQL SAST ────────────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per language so each uploads under its own
        # `/language:<name>` category. Analysing both in a single job would
        # force them to share one category, and whichever uploaded second
        # would replace the other's results.
        include:
          - language: javascript-typescript
            category: '/language:javascript-typescript'
          - language: actions
            category: '/language:actions'
    permissions:
      contents: read
      security-events: write  # upload CodeQL results
      actions: read           # read workflow run metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          # Extended security queries — covers OWASP Top 10
          queries: security-extended,security-and-quality

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # The category is what GitHub keys alerts by. It must stay
      # `/language:javascript-typescript` — the name previous runs used —
      # or every alert filed under the old name is orphaned: no run reports
      # on it any more, so nothing ever marks it fixed.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: ${{ matrix.category }}

  # ── 2. Secret scanning (Gitleaks) ─────────────────────────────────────────
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload gitleaks SARIF
    steps:
      - name: Checkout (full history for git log scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history — detect secrets in any commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Required for orgs
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pinned: the action otherwise installs whatever is latest, so a new
          # rule release silently turns a green build red. Keep this in step
          # with the version used to validate .gitleaks.toml locally.
          GITLEAKS_VERSION: 8.29.0
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # gitleaks-action always writes results.sarif; guard the upload anyway so
      # a scanner crash surfaces as the gitleaks failure rather than as a
      # confusing "file not found" in the upload step.
      - name: Upload Gitleaks SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: gitleaks

  # ── 3. ESLint security plugin ──────────────────────────────────────────────
  eslint-security:
    name: ESLint Security Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (with security plugin)
        run: |
          pnpm install --frozen-lockfile
          pnpm add -D eslint-plugin-security@latest --ignore-workspace-root-check || true

      - name: Run ESLint with security rules
        run: |
          # Run standard lint first
          pnpm run lint || true
          # Run with security plugin if available
          if pnpm list eslint-plugin-security --depth=0 2>/dev/null | grep -q eslint-plugin-security; then
            pnpm exec eslint src --ext .ts \
              --rule '{"security/detect-non-literal-fs-filename": "error", "security/detect-object-injection": "warn", "security/detect-possible-timing-attacks": "error"}' \
              --plugin security \
              --format json --output-file eslint-security.json || true
          fi

      - name: Upload ESLint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eslint-security-${{ github.sha }}
          path: eslint-security.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 4. License compliance ──────────────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: |
          pnpm dlx license-checker@25.0.1 \
            --production \
            --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;Unlicense;0BSD;CC-BY-3.0;CC-BY-4.0;Python-2.0' \
            --excludePackages '' \
            --json > license-report.json
          echo "License check passed"
          cat license-report.json | pnpm exec ts-node -e "
            const r = JSON.parse(require('fs').readFileSync('license-report.json','utf8'));
            console.log('Packages checked:', Object.keys(r).length);
          " || true

      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-report-${{ github.sha }}
          path: license-report.json
          retention-days: 90

  # ── 5. Dependency review (PR only) ────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block PRs that introduce HIGH or CRITICAL CVEs
          fail-on-severity: high
          # Block packages with known malicious behavior
          deny-licenses: GPL-2.0,GPL-3.0,LGPL-2.0,LGPL-2.1,LGPL-3.0,AGPL-1.0,AGPL-3.0

  # ── 6. pnpm audit ─────────────────────────────────────────────────────────
  pnpm-audit:
    name: pnpm Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (strict — fail on HIGH+)
        run: pnpm audit --prod --audit-level=high

      - name: Audit (full report including dev)
        run: pnpm audit --json > pnpm-audit-full.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pnpm-audit-${{ github.sha }}
          path: pnpm-audit-full.json
          retention-days: 30

  # ── 7. Package registry signature verification (U) ────────────────────────
  npm-audit-signatures:
    name: Package Signature Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm registry package signatures (Sigstore)
        # npm audit signatures checks that every installed package was signed
        # by its publisher on the npm registry using Sigstore / TUF.
        # Requires npm ≥9 (bundled with Node.js ≥18).
        run: npm audit signatures
