name: SLSA Provenance

# Generates SLSA v1.0 build provenance attestations for every push to main
# and every published release. Attestations are stored in the repository's
# GitHub attestations store and can be verified with:
#
#   gh attestation verify <package>.tgz --repo <owner>/<repo>
#
# Reference: https://slsa.dev/spec/v1.0/
# Action:    https://github.com/actions/attest-build-provenance

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write      # required for OIDC token used to sign the attestation
  attestations: write  # required to write attestations to the repo

jobs:
  provenance:
    name: Build and attest SLSA provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript → dist/
        run: pnpm run build

      - name: Compute artifact hashes (SHA-256)
        id: hash
        run: |
          cd dist
          find . -name '*.js' | sort | xargs sha256sum | tee ../artifact-hashes.sha256
          echo "Artifact hashes computed."

      - name: Pack the distributable tarball
        id: pack
        run: |
          TARBALL=$(pnpm pack | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL"

      # Attest the packed tarball — one subject, and the exact artifact a
      # consumer installs. The previous `dist/**/*.js` attested 853 separate
      # subjects, which meant 853 Sigstore signatures and a job that never
      # finished. The per-file SHA-256 manifest is still published below for
      # anyone who wants to check an individual compiled file.
      - name: Attest build provenance (SLSA v1.0)
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Upload artifact hashes as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-hashes-${{ github.sha }}
          path: |
            artifact-hashes.sha256
            *.tgz
          retention-days: 90

      - name: Print attestation bundle ID
        run: |
          echo "Attestation bundle: ${{ steps.attest.outputs.bundle-path }}"
          echo "Attestation URL:    ${{ steps.attest.outputs.attestation-url }}"
