# Codecov configuration.
#
# The headline number is scoped to the code the test suite actually targets,
# for the same reason the jest threshold in jest.config.cjs is scoped to
# ./src/utils/: this repository is ~90% thin introspection modules under
# src/tools/, one per Symfony feature, each a small read-and-format wrapper
# with no unit tests of its own. Measured across the whole tree the number
# lands at ~2%, which reads as "untested" and says nothing useful about the
# five-layer security pipeline that every tool call passes through — the part
# that is covered, by 377 tests, at ~61% of statements.
#
# src/tools/ is not hidden: the `components` block below reports it as its own
# line in the Codecov UI, so the gap stays visible and can be closed over time.
# It is only kept out of the badge and the status gate.

coverage:
  status:
    project:
      default:
        # The security pipeline must not regress.
        target: 90%
        threshold: 1%
        paths:
          - src/utils/
    patch:
      default:
        # New or changed lines should come with tests.
        target: 70%
        threshold: 5%

# Excluded from the badge and the project gate, reported separately below.
ignore:
  - src/tools/
  - src/tests/
  - src/fuzz/
  - dist/
  # src/transport/ is the optional HTTP/SSE transport: 201 lines at 0%, a real
  # and acknowledged gap. It is excluded so the badge measures the same thing
  # as the jest gate in jest.config.cjs — one number, one meaning — and it
  # stays visible as its own component below. Remove this line once it has
  # tests, which would raise the badge rather than lower it.
  - src/transport/

component_management:
  individual_components:
    - component_id: security_pipeline
      name: Security pipeline (src/utils)
      paths:
        - src/utils/
    - component_id: transport
      name: Transport (src/transport)
      paths:
        - src/transport/
    - component_id: tools
      name: Introspection tools (src/tools)
      paths:
        - src/tools/

comment:
  layout: 'reach, diff, flags, components'
  behavior: default
  require_changes: true
