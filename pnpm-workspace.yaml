# pnpm 11 requires an explicit decision for every dependency that ships a
# postinstall build script, rather than running them implicitly.
#
# unrs-resolver is a native module pulled in by jest-resolve (jest 30). Its
# build step is declined here: the test suite passes without it, and a
# security-oriented project has no reason to execute arbitrary install-time
# scripts in CI when the JavaScript fallback is sufficient. Revisit only if
# jest's resolution actually regresses.
allowBuilds:
  unrs-resolver: false

# Transitive advisories inside jest's babel/istanbul coverage chain. Both fixes
# are patch releases within the same major, so the APIs those packages rely on
# (js-yaml 3's safeLoad, brace-expansion 1's expand) are unchanged. The
# selectors are range-scoped so this cannot touch the js-yaml 5 that this
# project depends on directly.
overrides:
  js-yaml@3: ^3.15.1
  brace-expansion@1: ^1.1.18
